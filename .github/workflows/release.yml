name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: typst-community/setup-typst@v5.3.0
        with:
          typst-version: "0.15.1"
      # Use the same audience and presenter-note targets as local builds.
      - run: make slides.pdf slides-notes.pdf
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            slides.pdf
            slides-notes.pdf
