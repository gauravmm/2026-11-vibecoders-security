name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: typst-community/setup-typst@v5.3.0
        with:
          typst-version: "0.15.1"
      # typstyle's npm package lags the releases, so take the release binary.
      - name: Install typstyle
        run: |
          sudo curl -fsSL -o /usr/local/bin/typstyle \
            https://github.com/typstyle-rs/typstyle/releases/download/v0.15.2/typstyle-x86_64-unknown-linux-musl
          sudo chmod +x /usr/local/bin/typstyle
      - run: make check
